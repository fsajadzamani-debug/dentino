name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dentino.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dentino.jks" >> "$GITHUB_ENV"
          elif [ -f android/dentino.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/dentino.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found — APK is debug-signed and updates may need uninstall."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dentino-key-2026' }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dentino-key-2026' }}
          KEY_ALIAS: dentino
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Dentino-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Dentino-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: دنتینو نسخه 1.0.${{ github.run_number }}
          body: نسخه خودکار از آخرین تغییرات. فایل APK را دانلود و روی گوشی نصب کنید.
          files: out/*.apk
          make_latest: true

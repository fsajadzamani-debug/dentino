plugins {
    id 'com.android.application'
}

def vCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'ir.dentino.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.dentino.app"
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "dentino"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/webassets"
    }
}

// کپی وب‌اپ (پوشه www در ریشه مخزن) داخل assets/www
tasks.register('copyWebApp', Copy) {
    from "$rootDir/../www"
    into "$buildDir/generated/webassets/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
